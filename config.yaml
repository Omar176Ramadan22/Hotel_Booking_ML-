# Central project configuration.
# Keep task-specific settings here as the project develops.

dataset:
  path: data/H2.csv
  name: City Hotel H2

# Task-independent cleaning applied before any split (see src/data/load.py).
cleaning:
  drop_duplicates: true     # 25,902 exact copies; prevents train/test overlap
  adr_max: 1000             # removes the single ADR = 5400 record
  drop_zero_guests: true    # bookings with 0 adults, children and babies
  drop_zero_nights: true    # 231 bookings with 0 weekend + 0 week nights (no stay)
  adr_min: 0                # drops negative ADR (none in H2; ADR = 0 is kept here
                            # and handled per task, see regression below)

# Regression is trained and evaluated on PAID bookings only (ADR > 0).
# ADR = 0 rows (722 / 53,042 cleaned rows, 1.361%) are excluded by team policy;
# complimentary stays are one possible explanation, not a verified label.
# Classification keeps them. Applied in src/data/split.py BEFORE the split.
regression:
  paid_bookings_only: true
  split_strategy: group_shuffle
  test_size: 0.2

targets:
  regression: ADR
  classification: IsCanceled

outputs:
  dir: outputs

random_state: 42

# Shared cross-validation settings
cv:
  n_splits: 5
  # Regression uses deterministic GroupKFold (no shuffling).
  # Retained for future classification CV; unused by regression GroupKFold.
  shuffle: true
  random_state: 42

# Hyperparameter tuning settings
tuning:
  cv_folds: 3
  n_iter:
    decision_tree: 30
    random_forest: 15
    xgboost: 40
    ridge: 20
  subsample_rows:
    knn: 15000
    svr: 8000

