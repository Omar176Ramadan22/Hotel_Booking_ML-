dataset:
  path: data/H2.csv


cleaning:
  drop_duplicates: true
  adr_min: 0
  adr_max: 1000
  drop_zero_guests: true
  drop_zero_nights: true

regression:
  frozen_models: [ridge, xgboost, random_forest]
  paid_bookings_only: true
  test_size: 0.2

targets:
  regression: ADR
  classification: IsCanceled

outputs:
  dir: outputs

random_state: 42
cv:
  n_splits: 5


tuning:
  n_iter:
    xgboost: 40
    random_forest: 15
  cv_folds: 3
  ridge_grid:
    model__alpha: [0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    preprocess__encode__num__polynomial__degree: [1, 2]
